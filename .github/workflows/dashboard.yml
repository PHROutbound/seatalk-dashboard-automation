      - name: Send SeaTalk notification
        env:
          SEATALK_WEBHOOK: ${{ secrets.SEATALK_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          import subprocess

          webhook = os.environ["SEATALK_WEBHOOK"]

          report_time = subprocess.check_output(
              "TZ=Asia/Manila date '+%B %d, %Y | %I:%M %p'",
              shell=True,
              text=True
          ).strip()

          # Send text message
          text_payload = {
              "tag": "text",
              "text": {
                  "content": (
                      "📊 PHR Outbound Operations Dashboard\\n\\n"
                      "Good day, Team.\\n\\n"
                      "Please find attached the latest Outbound Operations Dashboard for your monitoring and reference.\\n\\n"
                      f"Report generated: {report_time}\\n\\n"
                      "Dashboard screenshot is attached below.\\n\\n"
                      "This is an automated dashboard notification generated by the monitoring system.\\n\\n"
                      "Thank you."
                  )
              }
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(text_payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)

          # Convert screenshot to Base64
          with open("dashboard.png", "rb") as f:
              image_b64 = base64.b64encode(f.read()).decode("utf-8")

          # Send image message
          image_payload = {
              "tag": "image",
              "image_base64": {
                  "content": image_b64
              }
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(image_payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)

          print("SeaTalk text and image sent successfully.")
          PY
