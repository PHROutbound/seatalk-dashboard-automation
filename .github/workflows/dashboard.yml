name: SeaTalk dashboard automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture dashboard screenshot
        run: node screenshot.js

      - name: Save latest screenshot
        run: |
          mkdir -p public
          cp dashboard.png public/dashboard.png

      - name: Commit latest screenshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/dashboard.png
          git commit -m "Update dashboard screenshot" || echo "No changes to commit"
          git push

      - name: Send SeaTalk notification
        env:
          SEATALK_WEBHOOK: ${{ secrets.SEATALK_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import subprocess

          report_time = subprocess.check_output(
              "TZ=Asia/Manila date '+%B %d, %Y | %I:%M %p'",
              shell=True,
              text=True
          ).strip()

          image_url = "https://raw.githubusercontent.com/PHROutbound/seatalk-dashboard-automation/main/public/dashboard.png"

          webhook = os.environ["SEATALK_WEBHOOK"]

          text_payload = {
              "tag": "text",
              "text": {
                  "content": (
                      "Good day, Team.\\n\\n"
                      "Please find attached the latest Outbound Operations Dashboard for your monitoring and reference.\\n\\n"
                      f"Report generated: {report_time}\\n\\n"
                      "This is an automated dashboard notification generated by the monitoring system.\\n\\n"
                      "Thank you."
                  )
              }
          }

          image_payload = {
              "tag": "image",
              "image": {
                  "image_url": image_url
              }
          }

          for payload in (text_payload, image_payload):
              req = urllib.request.Request(
                  webhook,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as response:
                  print(response.read().decode())
          PY
