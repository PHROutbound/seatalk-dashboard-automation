name: SeaTalk dashboard automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture dashboard screenshot
        run: node screenshot.js

      - name: Send SeaTalk notification
        env:
          SEATALK_WEBHOOK: ${{ secrets.SEATALK_WEBHOOK }}
        run: |
          REPORT_TIME=$(TZ=Asia/Manila date '+%B %d, %Y | %I:%M %p')

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          report_time = os.popen("TZ=Asia/Manila date '+%B %d, %Y | %I:%M %p'").read().strip()

          payload = {
              "tag": "text",
              "text": {
                  "content": (
                      "Good day, Team.\\n\\n"
                      "Please be informed that the latest Outbound Operations Dashboard has been generated successfully.\\n\\n"
                      f"Report generated: {report_time}\\n\\n"
                      "Kindly refer to the attached dashboard for your monitoring and reference.\\n\\n"
                      "This is an automated notification generated by the dashboard monitoring system.\\n\\n"
                      "Thank you."
                  )
              }
          }

          req = urllib.request.Request(
              os.environ["SEATALK_WEBHOOK"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req) as resp:
              print(resp.read().decode())
          PY
