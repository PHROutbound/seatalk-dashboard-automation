name: SeaTalk dashboard automation

on:
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture dashboard screenshot
        run: node screenshot.js

      - name: Send SeaTalk notification
        env:
          SEATALK_WEBHOOK: ${{ secrets.SEATALK_WEBHOOK }}
        run: |
          REPORT_TIME=$(TZ=Asia/Manila date '+%B %d, %Y | %I:%M %p')

          curl -X POST "$SEATALK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \\"tag\\": \\"text\\",
              \\"text\\": {
                \\"content\\": \\"Good day, Team.\\\\n\\\\nPlease be informed that the latest Outbound Operations Dashboard has been generated successfully.\\\\n\\\\nReport generated: ${REPORT_TIME}\\\\n\\\\nKindly refer to the attached dashboard for your monitoring and reference.\\\\n\\\\nThis is an automated notification generated by the dashboard monitoring system.\\\\n\\\\nThank you.\\"
              }
            }"
