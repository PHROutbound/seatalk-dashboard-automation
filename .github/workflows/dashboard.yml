name: SeaTalk dashboard automation

on:
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: node screenshot.js

      - name: Send SeaTalk notification
        env:
          SEATALK_WEBHOOK: ${{ secrets.SEATALK_WEBHOOK }}
        run: |
          REPORT_TIME=$(TZ=Asia/Manila date '+%B %d, %Y | %I:%M %p')

          MESSAGE=$(cat <<EOF
          Good day, Team.

          Please be informed that the latest Outbound Operations Dashboard has been generated successfully.

          Report generated: ${REPORT_TIME}

          Kindly refer to the attached dashboard for your monitoring and reference.

          This is an automated notification generated by the dashboard monitoring system.

          Thank you.
          EOF
          )

          curl -X POST "$SEATALK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\\"tag\\":\\"text\\",\\"text\\":{\\"content\\":\\"${MESSAGE//$'\\n'/\\\\n}\\"}}"
